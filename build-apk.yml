name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'voice-practice.html'
      - 'icon-*.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy the web app and icons
        run: |
          mkdir -p www assets
          if [ -f index.html ]; then cp index.html www/index.html; else cp voice-practice.html www/index.html; fi
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Set up Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets@3
          npx cap init "Vocal Practice Toolkit" com.vocalpracticetoolkit.app --web-dir www
          npx cap add android
          npx capacitor-assets generate --android

      - name: Allow microphone
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vocal-practice-toolkit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
